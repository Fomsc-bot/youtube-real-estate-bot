name: "🎬 Real Estate & Viral Shorts — Daily Upload"

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      niche:
        description: "Select Niche"
        required: false
        default: "real_estate"
        type: choice
        options: ["real_estate", "space"]
      topic:
        description: "Custom Topic Prompt (optional)"
        required: false
        default: ""

jobs:
  upload-shorts:
    name: "Build & Upload Viral Short"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "🔧 Install System Dependencies (FFmpeg + fonts)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            wget
          echo "FFmpeg version: $(ffmpeg -version | head -1)"

      - name: "🔤 Download Montserrat Bold font"
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/Montserrat-Bold.ttf ]; then
            wget -q -O assets/fonts/Montserrat-Bold.ttf \
              "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf"
            echo "Font downloaded: $(du -h assets/fonts/Montserrat-Bold.ttf)"
          else
            echo "Font already present"
          fi

      - name: "📚 Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "📁 Prepare output directory"
        run: mkdir -p output

      - name: "🚀 Run Viral Shorts Pipeline"
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          DRY_RUN_FLAG=""
          NICHE_FLAG=""
          TOPIC_FLAG=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.niche }}" ]; then
            NICHE_FLAG="--niche ${{ github.event.inputs.niche }}"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC_FLAG="--topic '${{ github.event.inputs.topic }}'"
          fi

          python main.py $DRY_RUN_FLAG $NICHE_FLAG $TOPIC_FLAG

      - name: "📎 Upload debug artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "pipeline-output-${{ github.run_id }}"
          path: |
            output/script.json
            output/scenes_meta.json
            output/audio_meta.json
            output/metadata.json
            output/upload_result.json
          retention-days: 7
          if-no-files-found: ignore

      - name: "❌ Report Pipeline Failure"
        if: failure()
        run: |
          echo "::error title=Pipeline Failed::The Daily Upload Pipeline encountered an issue."
          echo "::error::Common resolutions:"
          echo "::error::  1. Add 'GEMINI_API_KEY' to GitHub Repo Secrets (Settings -> Secrets -> Actions)"
          echo "::error::  2. Add 'YOUTUBE_CREDENTIALS_JSON' (Base64 JSON of YouTube OAuth2 token)"
          echo "::error::  3. Optional: Add 'PEXELS_API_KEY' for automatic 9:16 HD stock video fetching"
          echo "::error::Run locally to test: python main.py --dry-run"
