name: "BTS Spotlight — Daily Shorts Upload"

on:
  schedule:
    - cron: '30 12 * * *' # Daily at 12:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      topic:
        description: "Custom Topic Prompt (optional)"
        required: false
        default: ""

jobs:
  upload-shorts:
    name: "Build & Upload BTS Short"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install System Dependencies (FFmpeg + fonts)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            wget
          echo "FFmpeg version: $(ffmpeg -version | head -1)"

      - name: "Download Montserrat Bold font"
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/Montserrat-Bold.ttf ]; then
            wget -q -O assets/fonts/Montserrat-Bold.ttf \
              "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf"
            echo "Font downloaded: $(du -h assets/fonts/Montserrat-Bold.ttf)"
          else
            echo "Font already present"
          fi

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Prepare output directory"
        run: mkdir -p output

      - name: "Run Viral Shorts Pipeline"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: |
          DRY_RUN_FLAG=""
          TOPIC_FLAG=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC_FLAG="--topic '${{ github.event.inputs.topic }}'"
          fi

          python main.py $DRY_RUN_FLAG --niche bts $TOPIC_FLAG

      - name: "Upload debug artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "pipeline-output-${{ github.run_id }}"
          path: |
            output/script.json
            output/scenes_meta.json
            output/audio_meta.json
            output/metadata.json
            output/upload_result.json
          retention-days: 7
          if-no-files-found: ignore

      - name: "Report Pipeline Failure"
        if: failure()
        run: |
          echo "::error title=Pipeline Failed::The Daily Upload Pipeline encountered an issue."
          echo "::error::Common resolutions:"
          echo "::error::  1. Add 'GROQ_API_KEY' to GitHub Repo Secrets (Settings -> Secrets -> Actions)"
          echo "::error::  2. Add 'YOUTUBE_CREDENTIALS_JSON' (Base64 JSON of YouTube OAuth2 token)"
          echo "::error::  3. The workflow only publishes when a recent BTS source item and valid Gemini script are available."
          echo "::error::Run locally to test: python main.py --dry-run"
