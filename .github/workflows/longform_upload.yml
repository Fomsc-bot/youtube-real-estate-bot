
name: "BTS Long-form Fan Commentary"

on:
  workflow_dispatch:
  schedule:
    # US Eastern: 8 PM EST / 9 PM EDT
    - cron: "0 1 * * *"

    # US Eastern: 9 PM EST / 10 PM EDT
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  build-and-upload-longform:
    name: "Build and upload long-form BTS commentary"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install FFmpeg and fonts"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Research, build, and upload long-form video"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          LONGFORM_DRY_RUN: "false"
        run: python -m src.longform_pipeline

      - name: "Upload long-form review artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "longform-output-${{ github.run_id }}"
          path: output/longform/
          retention-days: 14
          if-no-files-found: warn
