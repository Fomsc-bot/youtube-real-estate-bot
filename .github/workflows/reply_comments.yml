name: "💬 The Universe — Auto Comment Replies"

on:
  schedule:
    - cron: "0 17 * * *"   # 5:00 PM UTC — 3 hours after daily upload (2 PM UTC)
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube Video ID to reply to (blank = auto-detect)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (generate replies but don't post)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  reply-comments:
    name: "Auto-reply to YouTube Comments"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Python dependencies ─────────────────────────────────────────────
      - name: "📚 Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Download latest pipeline artifacts ─────────────────────────────
      # We download the upload_result.json from the last successful daily run
      # to get the video ID automatically.
      - name: "📥 Download latest upload result"
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily_upload.yml
          name_is_regexp: true
          name: "pipeline-output-.*"
          path: output/
          if_no_artifact_found: ignore
        continue-on-error: true

      # ── 5. Run comment reply module ────────────────────────────────────────
      - name: "💬 Post Comment Replies"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: |
          VIDEO_ID_FLAG=""
          DRY_RUN_FLAG=""

          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            VIDEO_ID_FLAG="--video-id ${{ github.event.inputs.video_id }}"
          else
            VIDEO_ID_FLAG="--auto"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python src/reply_comments.py $VIDEO_ID_FLAG $DRY_RUN_FLAG

      # ── 6. Upload reply log ────────────────────────────────────────────────
      - name: "📎 Upload reply log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "comment-replies-${{ github.run_id }}"
          path: output/comment_replies.json
          retention-days: 7
          if-no-files-found: ignore

      # ── 7. Failure notice ──────────────────────────────────────────────────
      - name: "❌ Report Failure"
        if: failure()
        run: |
          echo "::error title=Comment Reply Failed::Auto-comment reply workflow failed."
          echo "::error::Common causes: GEMINI_API_KEY quota, YOUTUBE_CREDENTIALS_JSON expired"
