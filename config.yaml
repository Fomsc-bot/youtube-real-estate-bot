# ============================================================
# YouTube Shorts Pipeline Configuration — MoneyPrinterTurbo + Remotion
# ============================================================
# Edit these tunables to customise behavior without touching code.

pipeline:
  output_dir: "output"
  dry_run: false
  max_retries: 5
  backoff_base: 2.0

niche:
  # Default niche: real_estate | space | luxury_architecture | finance_hacks
  default: "real_estate"
  real_estate:
    cta: "Subscribe for daily luxury real estate tours & secrets!"
    category_id: "24" # Entertainment / Real Estate
    hashtag_broad: ["#shorts", "#realestate", "#luxuryhomes", "#architecture", "#mansion"]
    hashtag_niche: ["#luxuryrealestate", "#megamansion", "#househunt", "#interiordesign", "#property"]
  space:
    cta: "Subscribe for daily mind-blowing space facts!"
    category_id: "28" # Science & Technology
    hashtag_broad: ["#space", "#nasa", "#shorts", "#science", "#universe"]
    hashtag_niche: ["#astronomy", "#apod", "#spacefacts", "#cosmos", "#astrophotography"]

stock_visuals:
  # MoneyPrinterTurbo style visual fetching from Pexels / stock media
  pexels_api_env: "PEXELS_API_KEY"
  clips_per_script: 4 # Number of visual clips per Short
  min_clip_duration: 3.0 # Minimum duration per clip in seconds
  orientation: "portrait" # 9:16 aspect ratio search filter

audio:
  voice_id: "en"
  voice_speed: 1.05 # Slightly faster pacing for viral engagement
  audio_bitrate: "128k"
  bgm_enabled: true
  bgm_volume: 0.15 # Background music ducking volume relative to speech
  bgm_default: "assets/bgm/ambient_viral.mp3"

video:
  # Output resolution (9:16 vertical for Shorts)
  width: 1080
  height: 1920
  fps: 30
  max_duration: 58
  hook_duration: 2.5

  # Remotion / Motion Graphics styling
  karaoke_subtitles: true
  caption_font: "assets/fonts/Montserrat-Bold.ttf"
  caption_font_size: 64
  caption_color: "white"
  caption_highlight_color: "yellow"
  caption_stroke_color: "black"
  caption_stroke_width: 5
  caption_y_position: 0.68

  # Remotion-style overlays & subscriber conversion triggers
  subscribe_badge: true
  subscribe_badge_path: "assets/subscribe_badge.png"
  progress_bar: true
  progress_bar_color: "yellow"

  # Logo overlay
  logo_path: "assets/logo.png"
  logo_size: 90
  logo_opacity: 0.70
  logo_position: "bottom_right"
  logo_margin: 28

  # Video rendering
  video_codec: "libx264"
  audio_codec: "aac"
  video_preset: "fast"
  crf: 23

script:
  min_words: 45
  max_words: 70
  gemini_model: "gemini-2.0-flash-lite"

metadata:
  privacy_status: "public"
  made_for_kids: false
  contains_synthetic_media: false
  default_language: "en"
  max_hashtags: 6
  max_tags: 15

comments:
  reply_delay_hours: 3
  max_replies_per_run: 10
  min_comment_length: 15
  spam_keywords:
    - "subscribe back"
    - "sub4sub"
    - "check out my"
    - "visit my channel"
    - "click here"
    - "free money"
    - "earn $"
    - "http://"
    - "bit.ly"
    - "follow me"
    - "promo"
    - "discount"
